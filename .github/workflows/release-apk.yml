name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (when triggered manually)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Assemble APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment File for Secrets Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Artifact
        id: rename_apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_LABEL="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION_LABEL="${{ github.event.inputs.tag_name }}"
          else
            VERSION_LABEL="v1.0.0"
          fi
          APK_NAME="RudeusHabit-${VERSION_LABEL}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_name }}

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename_apk.outputs.version_label }}
          name: "Rudeus Habit (Remix Habit Tracker Pro) ${{ steps.rename_apk.outputs.version_label }}"
          files: ${{ steps.rename_apk.outputs.apk_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
